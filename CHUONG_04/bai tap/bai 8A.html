<HTML>
    <title> mở trang web bằng hàm open của đối tượng window.</title>
    <meta http-equiv="content-type" content="text/html"; charset = utf-8>
    <BODY>
        <script language = "Javascript">
        var LuaChon;
        LuaChon = prompt ("Bạn hãy nhập vào một trang web để mở trang web:", 1);
        switch (LuaChon){
            case "1": window.open("http://blu.edu.vn"); break;
            case "2": window.open("http://blu.edu.vn"); break;
            case "3": window.open("http://blu.edu.vn"); break;
            default : window.open("https://meta.vn");
        }
        </script>
    </BODY>
</HTML>
