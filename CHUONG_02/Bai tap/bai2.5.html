<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thể thao</title>
</head>

<body>

<table border="1" width="750" align="center" cellpadding="10">

    <tr>
        <td bgcolor="#eeeeee">
            <b>Đăng ký thể thao</b>
        </td>
    </tr>

    <tr>
        <td>

    
            <table width="100%">
                <tr>

                    <td width="45%" align="left">
                        <b>TRƯỜNG ĐẠI HỌC BẠC LIÊU</b>
                        <br>
                        KHOA KỸ THUẬT VÀ CÔNG NGHỆ
                    </td>

                    <td width="55%" align="center">
                        <b>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</b>
                        <br>
                        Độc lập - Tự do - Hạnh phúc
                    </td>

                </tr>
            </table>


            <h2 align="center">
                <font color="red">
                    PHIẾU ĐĂNG KÝ DỰ THI THỂ THAO
                </font>
            </h2>

            <table width="100%">

                <tr>

                    
                    <td width="200" align="center">

                        <img src="anh1.jpg"
                             width="150"
                             height="80"
                             alt="Logo trường Đại học Bạc Liêu">

                    </td>
                    <td>

                        <p>
                            <label for="hoten">
                                Họ tên:
                            </label>

                            <input type="text"
                                   id="hoten">
                        </p>


                        <p>
                            <label for="matkhau">
                                Mật khẩu:
                            </label>

                            <input type="password"
                                   id="matkhau">
                        </p>


                        <b>Môn thể thao:</b>

                        <br>

                        <input type="checkbox"
                               name="thethao"
                               value="Bóng đá">
                        Bóng đá

                        <br>

                        <input type="checkbox"
                               name="thethao"
                               value="Bóng chuyền">
                        Bóng chuyền

                        <br>

                        <input type="checkbox"
                               name="thethao"
                               value="Điền kinh">
                        Điền kinh

                        <br>

                        <input type="checkbox"
                               name="thethao"
                               value="Bơi lội">
                        Bơi lội

                    </td>

                </tr>

            </table>

        </td>
    </tr>

    <tr>
        <td>

            <h3 align="center">
                PHẦN CỨNG MÁY TÍNH
            </h3>

            <hr>


            <label for="thietbi">
                <b>Thiết bị</b>
            </label>

            <br>

            <select id="thietbi"
                    multiple
                    size="4">

                <option>CPU</option>
                <option>Mainboard</option>
                <option>ASUS DVD</option>
                <option>RAM KingMax</option>

            </select>


            <br>
            <br>


            <label for="thoigian">
                <b>Thời gian bảo hành:</b>
            </label>

            <br>

            <select id="thoigian">

                <option>1</option>
                <option>2</option>
                <option>3</option>

            </select>


            <br>
            <br>
            <input type="submit"
                   value="Submit">

            <input type="reset"
                   value="Reset">

        </td>
    </tr>

</table>

</body>
</html>
