<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký xét tuyển</title>
</head>

<body>

    <table border="1" width="800" align="center" cellpadding="10">
        <tr>
            <td>

                <table width="100%">
                    <tr>
                        <td width="45%" align="center">
                            <b>TRƯỜNG ĐẠI HỌC BẠC LIÊU</b><br>
                            <b>KHOA KỸ THUẬT VÀ CÔNG NGHỆ</b>
                        </td>

                        <td width="55%" align="center">
                            <b>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</b><br>
                            <b>Độc lập - Tự do - Hạnh phúc</b>
                        </td>
                    </tr>
                </table>

                <br>

                <h2 align="center">
                    <font color="red">
                        ĐĂNG KÝ XÉT TUYỂN
                    </font>
                </h2>

                <br>

                <table align="center" width="650">

                    <tr>
                        <td width="120">
                            Họ tên:
                        </td>

                        <td>
                            <input type="text" size="45">
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <br>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            Giới tính:
                        </td>

                        <td>
                            <input type="radio"
                                   name="gioitinh"
                                   id="nam"
                                   checked>

                            <label for="nam">Nam</label>

                            &nbsp;&nbsp;

                            <input type="radio"
                                   name="gioitinh"
                                   id="nu">

                            <label for="nu">Nữ</label>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <br>
                        </td>
                    </tr>

                    <tr>
                        <td valign="top">
                            Ngành thi:
                        </td>

                        <td>

                            <input type="radio"
                                   name="nganh"
                                   id="cntt"
                                   checked>

                            <label for="cntt">
                                Công nghệ thông tin
                            </label>

                            <br>

                            <input type="radio"
                                   name="nganh"
                                   id="mamnon">

                            <label for="mamnon">
                                Mầm non
                            </label>

                            <br>

                            <input type="radio"
                                   name="nganh"
                                   id="amnhac">

                            <label for="amnhac">
                                Âm nhạc
                            </label>

                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <br>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">

                            <input type="submit"
                                   value="Đồng ý">

                            &nbsp;&nbsp;

                            <input type="reset"
                                   value="Không đồng ý">

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
