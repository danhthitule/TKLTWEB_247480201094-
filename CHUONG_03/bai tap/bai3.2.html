<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bài tập 3.2</title>
</head>

<body>

    <!-- KHUNG LỚN -->
    <table border="2"
           bordercolor="black"
           width="550"
           cellpadding="10"
           cellspacing="0"
           align="center">

        <tr>
            <td>

                <!-- TIÊU ĐỀ Ở GIỮA -->
                <h2 align="center">
                    <font color="red">
                        QUÊ HƯƠNG
                    </font>
                </h2>


                <!-- ĐOẠN THƠ 1 -->
                <table border="1"
                       bordercolor="black"
                       bgcolor="blue"
                       width="100%"
                       cellpadding="10"
                       cellspacing="0">

                    <tr>
                        <td>
                            <font color="white"
                                  face="Times New Roman"
                                  size="3">
                                <i>
                                    Quê hương là chùm khế ngọt<br>
                                    Cho con trèo hái mỗi ngày<br>
                                    Quê hương là con diều biếc<br>
                                    Tuổi thơ con thả trên đồng
                                </i>
                            </font>
                        </td>
                    </tr>

                </table>


                <!-- ĐOẠN THƠ 2 - LIỀN VỚI ĐOẠN 1 -->
                <table border="1"
                       bordercolor="black"
                       bgcolor="brown"
                       width="100%"
                       cellpadding="10"
                       cellspacing="0">

                    <tr>
                        <td>
                            <font color="yellow"
                                  face="Times New Roman"
                                  size="3">
                                <i>
                                    Quê hương là cầu tre nhỏ<br>
                                    Mẹ về nón lá nghiêng che<br>
                                    Quê hương mỗi người chỉ một<br>
                                    Như là chỉ một mẹ thôi
                                </i>
                            </font>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>

    </table>

</body>

</html>
